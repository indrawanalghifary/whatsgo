version: '3.8'

services:
  whatsgo:
    build: .
    container_name: whatsgo-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/sessions.db
      - MAX_SESSIONS=10
      - QR_CODE_TIMEOUT=60
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/whatsgo.log
    volumes:
      - whatsgo_data:/app/data
      - whatsgo_logs:/app/logs
      - whatsgo_qr:/app/qr_codes
    restart: unless-stopped
    networks:
      - whatsgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whatsgo_data:
    driver: local
  whatsgo_logs:
    driver: local
  whatsgo_qr:
    driver: local

networks:
  whatsgo-network:
    driver: bridge